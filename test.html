<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Now</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .button {
            display: inline-block;
            padding: 1rem 3rem;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #1e1e2f;
            background: #ffd700;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }
        .tip {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #aaa;
        }
        .tip a {
            color: #ffd700;
            text-decoration: none;
        }
        .tip a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exclusive Content</h1>
        <p>Click the button below to watch now.</p>
        <!-- Replace the href with your actual link -->
        <a href="https://www.boldilocks.com" target="_blank" rel="noopener noreferrer" class="button">WATCH HERE</a>
        <div class="tip">
            ⚡ If the video doesn't open in your browser, copy this link and paste it into your default browser:<br>
            <span style="word-break: break-all;">https://www.example.com</span><br>
            (This helps bypass Reddit's internal browser)
        </div>
    </div>
</body>
</html>
